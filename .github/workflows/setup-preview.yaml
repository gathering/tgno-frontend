# A preview of each pull request on sys-k8s-prod, at
# https://tgno-pr<number>.preview.tg.no.
#
# This builds the image and adds the label "preview". Argo CD on the cluster
# lists the open pull requests with that label every two minutes, and runs
# the image tagged with the pull request's head commit. The platform side is
# docs/previews.md in gathering/sys-k8s-apps.
name: Build the preview image

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

env:
  DOMAIN: tgno-pr${{ github.event.number }}.preview.tg.no
  # The preview's Application in prod's Argo CD, for those who can log in
  ARGOCD_APP: https://argocd.sys-k8s-prod.gathering.systems/applications/argocd/systemstotte-tgno-pr${{ github.event.number }}

jobs:
  build:
    # Not for drafts. Not for a fork, whose token cannot push the image. Not
    # for Dependabot's pull requests: they are many, and each preview takes a
    # certificate from Let's Encrypt's weekly limit for tg.no.
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    # On the job, not the workflow: a run whose job is skipped then takes no
    # place in the group, and cancels no cleanup.
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      # The tag the cluster looks for: pr-<number>-<head commit, 8
      # characters>. github.sha is the merge commit GitHub makes, which the
      # cluster does not know.
      - name: Name the tag
        run: echo "TAG=pr-${NUMBER}-${SHA::8}" >> "$GITHUB_ENV"
        env:
          NUMBER: ${{ github.event.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build astro image for amd64
        id: docker_build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            APP_ENV=development
          push: true
          # One manifest per tag. With provenance, the tag is an index whose
          # parts are untagged versions that cleanup-preview.yaml cannot
          # tell from those of latest, and would leave behind.
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Only once the image is there, so a new preview never waits for it.
      # Later pushes keep the label, and the preview moves to the new image
      # a few minutes after it is pushed. The REST call needs only
      # pull-requests: write, where gh pr edit also reads the PR's projects.
      - name: Add the label preview
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels" -f 'labels[]=preview' --silent
        env:
          NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: setup-preview-environment
          message: |
            ### Preview Environment
            ${{ github.event.pull_request.head.sha }} will be at https://${{ env.DOMAIN }} a few minutes after this build.

            ghcr.io/${{ github.repository }}:${{ env.TAG }} (${{ steps.docker_build_push.outputs.digest }})
            [Argo CD Application](${{ env.ARGOCD_APP }})
      # The cluster has already moved to the new commit and waits for its
      # image. The pod of the commit before keeps serving.
      - uses: marocchino/sticky-pull-request-comment@v2
        if: failure()
        with:
          header: setup-preview-environment
          message: |
            ### Preview Environment
            The build of ${{ github.event.pull_request.head.sha }} failed. A preview that is running stays on the commit before it until a build succeeds.

            [Argo CD Application](${{ env.ARGOCD_APP }})

# Ends the preview of a pull request that closes or goes back to draft
# (setup-preview.yaml). A closed pull request drops out on the cluster by
# itself. A draft keeps its label, so it is taken off here. Then the images
# of the pull request are deleted.
name: Cleanup Preview Environment

on:
  pull_request:
    types:
      - closed
      - converted_to_draft

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  cleanup-preview-environment:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      packages: write
      pull-requests: write
    steps:
      - name: Remove the label preview
        if: github.event.action == 'converted_to_draft'
        run: gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label preview
        env:
          NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Every image of this pull request: pr-<number>-<commit>, one for each
      # push, and preview-pr<number> from the old cluster. A version that
      # also has another tag is left alone.
      - name: Delete the pull request's images
        run: |
          versions="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions"
          gh api --paginate "$versions?per_page=100" --jq '
            .[] | select((.metadata.container.tags | length) > 0
              and all(.metadata.container.tags[];
                startswith("pr-\(env.NUMBER)-") or . == "preview-pr\(env.NUMBER)"))
            | .id' |
          while read -r id; do
            echo "Deleting version $id"
            gh api --method DELETE "$versions/$id"
          done
        env:
          NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: setup-preview-environment
          message: |
            ### Preview Environment deleted

# Ends the preview of a pull request that closes or goes back to draft
# (setup-preview.yaml): the label comes off, which ends the preview on the
# cluster, and the images of the pull request are deleted. A closed pull
# request would drop out by itself. Without the label, one that is reopened
# gets its preview once the new image is there, as a new one does.
name: Cleanup Preview Environment

on:
  pull_request:
    types:
      - closed
      - converted_to_draft

jobs:
  cleanup-preview-environment:
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      packages: write
      pull-requests: write
    steps:
      # Only if it is there: removing a label the pull request does not
      # have is an error.
      - name: Remove the label preview
        shell: bash
        run: |
          labels="repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels"
          if gh api "$labels" --jq '.[].name' | grep -qx preview; then
            gh api --method DELETE "$labels/preview" --silent
          fi
        env:
          NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Every image of this pull request: pr-<number>-<commit>, one for each
      # push, and preview-pr<number> from the old cluster. A version that
      # also has another tag is left alone. The list is read in full before
      # anything is deleted, since a deletion moves the pages after it.
      - name: Delete the pull request's images
        shell: bash
        run: |
          versions="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions"
          # An assignment, so that a listing that fails fails the step
          ids=$(gh api --paginate "$versions?per_page=100" --jq '
            .[] | select((.metadata.container.tags | length) > 0
              and all(.metadata.container.tags[];
                startswith("pr-\(env.NUMBER)-") or . == "preview-pr\(env.NUMBER)"))
            | .id')
          for id in $ids; do
            echo "Deleting version $id"
            gh api --method DELETE "$versions/$id"
          done
        env:
          NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only on a pull request that had a preview, and so the comment
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: setup-preview-environment
          only_update: true
          message: |
            ### Preview Environment deleted

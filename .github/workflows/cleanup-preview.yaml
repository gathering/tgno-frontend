# Ends a PR's preview when it closes or goes back to draft: removes the
# label, which stops the preview, and deletes the PR's images.
name: Clean up the preview

on:
  pull_request:
    types:
      - closed
      - converted_to_draft

jobs:
  cleanup-preview-environment:
    # Not for forks: their token cannot do either
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      packages: write
      pull-requests: write
    steps:
      # Removing a label the PR does not have is an error
      - name: Remove the label preview
        if: contains(github.event.pull_request.labels.*.name, 'preview')
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$NUMBER/labels/preview" --silent
        env:
          NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tags pr-<number>-*, and preview-pr<number> from the old cluster.
      # Images with any other tag stay. The full list is read before
      # deleting, since deleting shifts the pages.
      - name: Delete the PR's images
        shell: bash
        run: |
          versions="/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}/versions"
          # An assignment, so a failed listing fails the step
          ids=$(gh api --paginate "$versions?per_page=100" --jq '
            .[] | select((.metadata.container.tags | length) > 0
              and all(.metadata.container.tags[];
                startswith("pr-\(env.NUMBER)-") or . == "preview-pr\(env.NUMBER)"))
            | .id')
          for id in $ids; do
            echo "Deleting version $id"
            gh api --method DELETE "$versions/$id"
          done
        env:
          NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only if the PR had a preview comment
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: setup-preview-environment
          only_update: true
          message: |
            ### Preview Environment deleted

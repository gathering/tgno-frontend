# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # pnpm is supported indirectly via npm
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "16:00"
      timezone: "CET"

    open-pull-requests-limit: 4

    groups:
      # Security updates: one PR for all non-major fixes (direct and transitive).
      # Majors fall outside the group and get their own PR.
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Packages that are released in lockstep or have peer dependencies on each
      # other are grouped for all update types, so majors move together.
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "astro*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # Everything else: minor/patch only. Majors get individual PRs.
      catch-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    labels:
      - "dependencies"
      - "dependabot"
